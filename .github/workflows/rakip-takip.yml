name: Rakip Takip Sistemi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  takip:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programı çalıştır
        run: python takip.py
